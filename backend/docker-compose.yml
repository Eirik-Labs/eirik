services:
  postgres:
    image: postgres:16-alpine
    container_name: eirik-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eirik

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eirik"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: eirik-api

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started  

  loki:
    image: grafana/loki:latest
    container_name: eirik-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: eirik-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki      

  tempo:
    image: grafana/tempo:latest
    container_name: eirik-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
      - "4317:4317"
    volumes:
    - ./tempo.yaml:/etc/tempo.yaml
    - tempo_data:/var/tempo
  
  prometheus:
    image: prom/prometheus:latest
    container_name: eirik-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # depends_on:
    #   - api

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  tempo_data:
  prometheus_data:



 